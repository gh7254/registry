version: "3.8"

services:
  app-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app_container
    ports:
      - "3003:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: todo-db
    restart: unless-stopped
    environment:
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
