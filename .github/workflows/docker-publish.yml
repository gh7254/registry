name: CI/CD Docker to VM

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Short SHA
        id: vars
        run: echo "sha_tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev-${{ steps.vars.outputs.sha_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-vm:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository in VM
        uses: actions/checkout@v6

      - name: Login to GHCR from VM
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Create environment file
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          cat > .env <<EOF
          NODE_ENV=$NODE_ENV
          MYSQL_HOST=$MYSQL_HOST
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_DB=$MYSQL_DB
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          MYSQL_DATABASE=$MYSQL_DATABASE
          EOF
      - name: Pull and restart application
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          docker compose pull app-server
          docker compose up -d app-server

      - name: Show running containers
        run: docker ps
